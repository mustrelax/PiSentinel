<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pi-Sentinel • Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{color-scheme:dark light}
    body {
      margin:0; display:grid; min-height:100vh; place-items:center;
      background:#111; color:#eee; font-family:system-ui, sans-serif;
    }
    .card {
      width:min(360px, 92vw);
      background:#181818; border:1px solid #333; border-radius:12px;
      padding:20px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    h1 { margin:0 0 16px; font-size:20px; }
    form { display:grid; gap:8px; justify-items:center; }
    label, input, button, .msg { width:100%; max-width:260px; }
    label { margin-top:6px; font-size:14px; opacity:.9; text-align:left; }
    input {
      padding:10px 12px; border-radius:8px; border:1px solid #444;
      background:#222; color:#eee;
    }
    button {
      margin-top:10px; padding:10px 12px; border-radius:8px;
      border:1px solid #444; background:#2a6; color:#fff;
      font-weight:600; cursor:pointer;
    }
    .msg { min-height:1.2em; font-size:14px; opacity:.9; text-align:center; }
    .muted { opacity:.7; font-size:13px; margin-top:12px; display:block; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>

    <form id="form" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username"
             autocomplete="off"
             autocapitalize="none"
             autocorrect="off"
             spellcheck="false"
             required
             placeholder="Enter username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" 
             required
             placeholder="Enter password" />

      <button type="submit">Login</button>
      <div class="msg" id="msg"></div>
    </form>

    <span class="muted">Default: <code>admin / admin</code> :P</span>
  </div>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = 'Signing in...';
      const fd = new FormData(form);
      const res = await fetch('/login', { method: 'POST', body: fd });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        msg.textContent = data.error || 'Login failed';
        return;
      }
      msg.textContent = 'Success. Redirecting...';
      location.href = data.redirect || '/';
    });
  </script>
</body>
</html>
